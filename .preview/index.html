<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carrot HA · 충전 그래프 번개 병합 미리보기</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;background:#0b0d0f;color:#e8eaeb;font-family:Inter,Pretendard,'Noto Sans KR',system-ui,sans-serif}
  .wrap{max-width:1760px;margin:0 auto;padding:24px}
  h1{font-size:22px;margin:0 0 6px}
  p.sub{color:#9aa1a6;font-size:13px;margin:0 0 18px;line-height:1.7}
  .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
  .controls button{background:#202528;border:1px solid #343a3e;color:#e8eaeb;border-radius:10px;padding:9px 14px;font-size:13px;cursor:pointer}
  .controls button.active{background:#31505e;border-color:#4a7c92}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
  @media (max-width:900px){.grid{grid-template-columns:1fr}}
  .col{min-width:0}
  .col h3{font-size:14px;margin:0 0 10px;padding:8px 12px;border-radius:10px;background:#171b1e;border:1px solid #262b2f;display:flex;align-items:center;gap:8px;letter-spacing:.2px}
  .col h3 b{color:#72df9b;font-weight:650}
  .tag{font-size:10px;background:#263136;color:#a9c9d6;border-radius:6px;padding:3px 8px;font-weight:600}
  .note{font-size:12px;color:#8f979c;line-height:1.7;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>충전 탭 · 번개 그래프 수정 미리보기</h1>
  <p class="sub">샘플 데이터: 새벽 0–4시·10시·저녁 19–21시에 충전 기록이 있는 하루입니다. 충전 탭의 "선택한 날짜의 배터리 잔량" 그래프만 표시됩니다. 현재 화면과 수정안 B를 비교해 보세요.</p>
  <div class="controls">
    <button data-theme="dark" class="active">다크 테마</button>
    <button data-theme="light">라이트 테마</button>
  </div>
  <div class="grid">
    <div class="col"><h3>① 현재 <span class="tag">원본</span></h3><carrot-dash-current></carrot-dash-current><p class="note">충전 시간마다 막대 위 번개 아이콘 + 초록 SOC 막대가 따로 표시됩니다.</p></div>
    <div class="col"><h3>③ 수정안 B <span class="tag">인접 충전 영역 병합</span></h3><carrot-dash-b></carrot-dash-b><p class="note">인접한 충전 배경만 이어붙이고 번개는 구간당 1개로 합칩니다. 바 간격과 아이콘은 원본 그대로입니다.</p></div>
  </div>
</div>
<script src="./mock.js"></script>
<script type="module">
  // Preview-only stand-ins for HA components; the real dashboard code is unchanged.
  const iconFallback = '<circle cx="12" cy="12" r="3" fill="currentColor"/>';
  const iconMap = {
    'mdi:flash': '<path d="M7,2V13H10V22L17,10H13L17,2H7Z"/>',
    'mdi:battery': '<path d="M16.67,4H15V2H9V4H7.33A1.33,1.33 0 0,0 6,5.33V20.67C6,21.4 6.6,22 7.33,22H16.66C17.4,22 18,21.4 18,20.67V5.33C18,4.6 17.4,4 16.67,4Z"/>',
    'mdi:battery-plus': '<path d="M16.67,4C17.4,4 18,4.6 18,5.33V20.67C18,21.4 17.4,22 16.67,22H7.33C6.6,22 6,21.4 6,20.67V5.33C6,4.6 6.6,4 7.33,4H9V2H15V4H16.67M13,7H11V10H8V12H11V15H13V12H16V10H13V7Z"/>',
    'mdi:power-plug': '<path d="M16,7V3H14V7H10V3H8V7H7A1,1 0 0,0 6,8V14A1,1 0 0,0 7,15H8V22H16V15H17A1,1 0 0,0 18,14V8A1,1 0 0,0 17,7H16Z"/>',
    'mdi:ev-station': '<path d="M18.92,2C18.72,2 18.42,2.4 18.42,2.4L13.92,8.36V3.5L13,4.5L9.92,8.4C9.72,8.4 9.62,8.6 9.62,8.6L7.92,11.7C7.92,11.7 7.6,12.3 8.42,12.3H10.42V19.8C10.42,19.8 10.42,20 10.72,20C11.02,20 11.02,19.8 11.02,19.8V12.4H12.42V20C12.42,20 12.42,20 12.72,20C13.02,20 13.02,19.8 13.02,19.8V12.4H14.92V19.8C14.92,19.8 14.92,20 15.22,20C15.52,20 15.52,19.8 15.52,19.8V12.4H16.42C17.72,12.4 18.32,11.2 17.72,10.1L16.42,8.4H17.22C17.72,8.4 18.02,8.1 18.02,7.7V3C18.42,3 18.72,2.5 18.92,2M12.42,11V7.2L15.42,11H12.42Z"/>',
  };
  class HaCard extends HTMLElement {}
  class HaIcon extends HTMLElement {
    connectedCallback() {
      const key = this.getAttribute('icon');
      const body = iconMap[key] || iconFallback;
      this.innerHTML = `<svg viewBox="0 0 24 24" style="width:100%;height:100%;display:block" fill="currentColor" aria-hidden="true">${body}</svg>`;
    }
  }
  customElements.define('ha-card', HaCard);
  customElements.define('ha-icon', HaIcon);

  const [{ default: Cur }, { default: B }] = await Promise.all([
    import('./original/carrot-dashboard-ko.js'),
    import('./variant-b/carrot-dashboard-ko.js')
  ]);

  customElements.define('carrot-dash-current', Cur);
  customElements.define('carrot-dash-b', B);

  const config = {
    device_id: 'demo',
    vehicle_name: 'VW ID.4 Lounge',
    charging_entity: 'switch.charger',
    online_entity: 'binary_sensor.comma_online',
    color_mode: 'dark'
  };

  function makeHass() {
    return {
      callApi: (method, path) => window.CARROT_MOCK.callApi(method, path),
      states: { ...window.CARROT_MOCK.states },
      themes: { ...window.CARROT_MOCK.themes }
    };
  }

  function mount(el) {
    el.tab = 'charge';
    try { localStorage.removeItem('carrot-theme-demo'); } catch {}
    el.setConfig({ ...config });
    el.hass = makeHass();
  }
  mount(document.querySelector('carrot-dash-current'));
  mount(document.querySelector('carrot-dash-b'));

  document.querySelectorAll('.controls button').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const mode = btn.dataset.theme;
      try { localStorage.setItem('carrot-theme-demo', mode); } catch {}
      document.querySelectorAll('carrot-dash-current, carrot-dash-b').forEach(el => el.setConfig({ ...config }));
    };
  });
</script>
</body>
</html>
